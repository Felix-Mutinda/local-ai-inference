<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Step 02: GGUF parser</title>
<desc id="d">The parser reads a GGUF file's header, metadata and tensor index, memory-maps the aligned data section, and dequantizes tensors on request. It hands the engine metadata and tensors through the ModelFile protocol at startup.</desc>
<defs>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5f5e5a"/></marker>
</defs>
<rect width="800" height="1000" fill="#ffffff"/>
<text x="400" y="62" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700"><tspan fill="#1a3a52">Step 02</tspan><tspan fill="#1a3a52" dx="12">·</tspan><tspan fill="#c57926" dx="12">GGUF Parser</tspan></text>
<g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect x="250" y="100" width="300" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1.5"/>
<text x="400" y="124" text-anchor="middle" font-size="16" font-weight="600" fill="#2d2d2d">Engine · stub</text>
<text x="400" y="144" text-anchor="middle" font-size="12" fill="#5f5e5a">real engine in step-03</text>
<line x1="400" y1="236" x2="400" y2="160" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ahg)"/>
<text x="412" y="186" font-size="13" font-weight="600" fill="#2d2d2d">ModelFile protocol</text>
<text x="412" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#666666">metadata · tensor(name)</text>

<rect x="60" y="216" width="680" height="268" rx="16" fill="none" stroke="#c57926" stroke-width="2"/>
<text x="724" y="236" text-anchor="end" font-size="12" font-weight="600" fill="#a45a00">this step</text>
<rect x="84" y="244" width="632" height="220" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/>
<text x="104" y="272" font-size="16" font-weight="600" fill="#085041">Parser</text>
<text x="696" y="272" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0f6e56">parser/gguf.py · GGUFFile</text>
<rect x="99" y="290" width="190" height="70" rx="6" fill="#ffffff" stroke="#0f6e56"/>
<text x="194" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Header</text>
<text x="194" y="338" text-anchor="middle" font-size="12" fill="#0f6e56">magic · version · counts</text>
<rect x="305" y="290" width="190" height="70" rx="6" fill="#ffffff" stroke="#0f6e56"/>
<text x="400" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Metadata</text>
<text x="400" y="338" text-anchor="middle" font-size="12" fill="#0f6e56">typed keys · arrays</text>
<rect x="511" y="290" width="190" height="70" rx="6" fill="#ffffff" stroke="#0f6e56"/>
<text x="606" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Tensor index</text>
<text x="606" y="338" text-anchor="middle" font-size="12" fill="#0f6e56">name · shape · type</text>
<rect x="99" y="376" width="190" height="70" rx="6" fill="#ffffff" stroke="#0f6e56"/>
<text x="194" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Alignment</text>
<text x="194" y="424" text-anchor="middle" font-size="12" fill="#0f6e56">data on a boundary</text>
<rect x="305" y="376" width="190" height="70" rx="6" fill="#ffffff" stroke="#0f6e56"/>
<text x="400" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Memory map</text>
<text x="400" y="424" text-anchor="middle" font-size="12" fill="#0f6e56">zero-copy views</text>
<rect x="511" y="376" width="190" height="70" rx="6" fill="#ffffff" stroke="#0f6e56"/>
<text x="606" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Dequantize</text>
<text x="606" y="424" text-anchor="middle" font-size="12" fill="#0f6e56">F16 · BF16 · Q8_0 · Q4_0</text>

<line x1="400" y1="560" x2="400" y2="490" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ahg)"/>
<text x="412" y="530" font-size="13" fill="#5f5e5a">read index · map data</text>

<rect x="84" y="562" width="632" height="132" rx="8" fill="#ffffff" stroke="#314d95" stroke-width="1.5"/>
<text x="104" y="590" font-size="16" font-weight="600" fill="#1a3a52">GGUF file</text>
<text x="696" y="590" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#666666">SmolLM2-135M-Instruct-Q8_0.gguf</text>
<rect x="99" y="606" width="92" height="72" rx="6" fill="#ffffff" stroke="#314d95"/>
<text x="145.0" y="635" text-anchor="middle" font-size="14" font-weight="600" fill="#1a3a52">Header</text>
<text x="145.0" y="655" text-anchor="middle" font-size="12" fill="#666666">4 fields</text>
<rect x="201" y="606" width="150" height="72" rx="6" fill="#ffffff" stroke="#314d95"/>
<text x="276.0" y="635" text-anchor="middle" font-size="14" font-weight="600" fill="#1a3a52">Metadata</text>
<text x="276.0" y="655" text-anchor="middle" font-size="12" fill="#666666">key → value</text>
<rect x="361" y="606" width="150" height="72" rx="6" fill="#ffffff" stroke="#314d95"/>
<text x="436.0" y="635" text-anchor="middle" font-size="14" font-weight="600" fill="#1a3a52">Tensor index</text>
<text x="436.0" y="655" text-anchor="middle" font-size="12" fill="#666666">name → offset</text>
<rect x="521" y="606" width="180" height="72" rx="6" fill="#ffffff" stroke="#314d95"/>
<text x="611.0" y="635" text-anchor="middle" font-size="14" font-weight="600" fill="#1a3a52">Data</text>
<text x="611.0" y="655" text-anchor="middle" font-size="12" fill="#666666">weights, aligned</text>

<rect x="84" y="724" width="632" height="120" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1.5"/>
<text x="104" y="752" font-size="16" font-weight="600" fill="#2d2d2d">One Q8_0 block: 34 bytes → 32 numbers</text>
<rect x="104" y="770" width="120" height="48" rx="6" fill="#ffffff" stroke="#5f5e5a"/>
<text x="164" y="799" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#2d2d2d">scale · fp16</text>
<rect x="232" y="770" width="300" height="48" rx="6" fill="#ffffff" stroke="#5f5e5a"/>
<text x="382" y="799" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#2d2d2d">q · 32 × int8</text>
<text x="548" y="799" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#2d2d2d">→ scale × q</text>

<text x="400" y="905" text-anchor="middle" font-size="18" font-style="italic" fill="#2d2d2d">Opening a model reads the index, <tspan font-weight="700" fill="#a45a00">not the weights.</tspan></text>
<text x="32" y="952" font-size="13" fill="#666666">dashed = load path at startup · blue = data on disk · orange = this step</text>
</g>
<g transform="translate(713 904) scale(0.0554)" aria-label="AI System Design mark">
<g>
<polygon fill="#c57926" points="501.0,17.8 501.0,314.6 981.5,295.3"/>
<polygon fill="#c57926" points="501.0,314.6 981.5,295.3 741.9,724.0"/>
<polygon fill="#c57926" points="981.5,295.3 741.9,724.0 982.2,852.0"/>
</g>
<g fill="none" stroke="#314d95" stroke-width="17.8" stroke-linejoin="miter" stroke-linecap="round">
<polygon points="501.0,17.8 981.5,295.3 982.2,852.0 502.5,1137.3 18.9,853.2 17.8,298.4"/>
<polygon points="501.0,314.6 741.9,724.0 260.0,724.2"/>
<polyline points="17.8,298.4 501.0,314.6 981.5,295.3"/>
<polyline points="501.0,17.8 501.0,314.6"/>
<polyline points="17.8,298.4 260.0,724.2 18.9,853.2"/>
<polyline points="981.5,295.3 741.9,724.0 982.2,852.0"/>
<polyline points="260.0,724.2 502.5,1137.3 741.9,724.0"/>
</g>
