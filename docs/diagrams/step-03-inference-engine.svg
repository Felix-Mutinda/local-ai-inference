<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Step 03: inference engine</title>
<desc id="d">The server calls the engine through the Engine protocol. The engine tokenizes with a byte-level BPE rebuilt from the GGUF file, prefills the prompt, then decodes one token at a time through 30 Llama blocks, storing keys and values in a KV cache and sampling each next token. It loads weights from the parser through the ModelFile protocol at startup.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f6e56"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5f5e5a"/></marker>
</defs>
<rect width="800" height="1000" fill="#ffffff"/>
<text x="400" y="62" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700"><tspan fill="#1a3a52">Step 03</tspan><tspan fill="#1a3a52" dx="12">·</tspan><tspan fill="#c57926" dx="12">Inference Engine</tspan></text>
<g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect x="250" y="100" width="300" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1.5"/>
<text x="400" y="124" text-anchor="middle" font-size="16" font-weight="600" fill="#2d2d2d">Server · API</text>
<text x="400" y="144" text-anchor="middle" font-size="12" fill="#5f5e5a">step-01</text>
<line x1="400" y1="156" x2="400" y2="240" stroke="#0f6e56" stroke-width="2" marker-end="url(#ah)"/>
<text x="412" y="182" font-size="13" font-weight="600" fill="#2d2d2d">Engine protocol</text>
<text x="412" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#666666">tokenize · generate(ids)</text>

<rect x="60" y="216" width="680" height="476" rx="16" fill="none" stroke="#c57926" stroke-width="2"/>
<text x="724" y="236" text-anchor="end" font-size="12" font-weight="600" fill="#a45a00">this step</text>
<rect x="84" y="244" width="632" height="428" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/>
<text x="104" y="272" font-size="16" font-weight="600" fill="#085041">Engine</text>
<text x="696" y="272" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0f6e56">engine/ · GGUFEngine</text>
<rect x="99" y="290" width="190" height="70" rx="6" fill="#ffffff" stroke="#0f6e56"/>
<text x="194" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Tokenizer</text>
<text x="194" y="338" text-anchor="middle" font-size="12" fill="#0f6e56">byte-level BPE from GGUF</text>
<rect x="305" y="290" width="190" height="70" rx="6" fill="#ffffff" stroke="#0f6e56"/>
<text x="400" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">KV cache</text>
<text x="400" y="338" text-anchor="middle" font-size="12" fill="#0f6e56">K, V per layer · grows</text>
<rect x="511" y="290" width="190" height="70" rx="6" fill="#ffffff" stroke="#0f6e56"/>
<text x="606" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Sampler</text>
<text x="606" y="338" text-anchor="middle" font-size="12" fill="#0f6e56">greedy · temp · top-p</text>
<rect x="99" y="376" width="190" height="70" rx="6" fill="#ffffff" stroke="#0f6e56"/>
<text x="194" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Prefill</text>
<text x="194" y="424" text-anchor="middle" font-size="12" fill="#0f6e56">whole prompt at once</text>
<rect x="305" y="376" width="190" height="70" rx="6" fill="#ffffff" stroke="#0f6e56"/>
<text x="400" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Decode loop</text>
<text x="400" y="424" text-anchor="middle" font-size="12" fill="#0f6e56">one token at a time</text>
<rect x="511" y="376" width="190" height="70" rx="6" fill="#ffffff" stroke="#0f6e56"/>
<text x="606" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Stop</text>
<text x="606" y="424" text-anchor="middle" font-size="12" fill="#0f6e56">EOS · max_tokens · cancel</text>

<rect x="99" y="462" width="602" height="194" rx="6" fill="#ffffff" stroke="#0f6e56"/>
<text x="115" y="490" font-size="14" font-weight="600" fill="#085041">Llama block × 30</text>
<text x="685" y="490" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0f6e56">engine/llama.py</text>
<rect x="115" y="522" width="110" height="62" rx="6" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="170.0" y="554" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">RMSNorm</text>
<line x1="225" y1="553" x2="245" y2="553" stroke="#0f6e56" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="247" y="522" width="180" height="62" rx="6" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="337.0" y="545" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Attention</text>
<text x="337.0" y="566" text-anchor="middle" font-size="12" fill="#0f6e56">9 Q · 3 KV heads · RoPE</text>
<line x1="427" y1="553" x2="447" y2="553" stroke="#0f6e56" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="449" y="522" width="110" height="62" rx="6" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="504.0" y="554" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">RMSNorm</text>
<line x1="559" y1="553" x2="579" y2="553" stroke="#0f6e56" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="581" y="522" width="110" height="62" rx="6" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="636.0" y="545" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Feed-forward</text>
<text x="636.0" y="566" text-anchor="middle" font-size="12" fill="#0f6e56">SwiGLU</text>
<text x="400" y="612" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#2d2d2d">x += attention(norm(x));  x += ffn(norm(x))</text>
<text x="400" y="636" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#666666">embed → 30 blocks → norm → tied output → logits</text>

<line x1="400" y1="790" x2="400" y2="698" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ahg)"/>
<text x="412" y="736" font-size="13" font-weight="600" fill="#5f5e5a">ModelFile protocol</text>
<text x="412" y="754" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#666666">metadata · tensor(name)</text>
<rect x="250" y="792" width="300" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1.5"/>
<text x="400" y="816" text-anchor="middle" font-size="16" font-weight="600" fill="#2d2d2d">Parser · GGUF file</text>
<text x="400" y="836" text-anchor="middle" font-size="12" fill="#5f5e5a">dequantized once, at load</text>

<text x="400" y="905" text-anchor="middle" font-size="18" font-style="italic" fill="#2d2d2d">Every new token is <tspan font-weight="700" fill="#a45a00">one pass over all the weights.</tspan></text>
<text x="32" y="952" font-size="13" fill="#666666">solid = request path · dashed = load path at startup · orange = this step</text>
</g>
