<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1140" width="800" height="1140" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Step 01: serving layer</title>
<desc id="d">A client calls the API over HTTP and SSE. The API hands Pydantic models to the server, which handles lifecycle, admission, prompt preparation, output control, streaming and metrics. The server calls a stub engine through the Engine protocol. The parser and GGUF file are planned for step 02.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f6e56"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5f5e5a"/></marker>
</defs>
<rect width="800" height="1140" fill="#ffffff"/>

<text x="400" y="62" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700"><tspan fill="#1a3a52">Step 01</tspan><tspan fill="#1a3a52" dx="12">·</tspan><tspan fill="#c57926" dx="12">Serving Layer</tspan></text>

