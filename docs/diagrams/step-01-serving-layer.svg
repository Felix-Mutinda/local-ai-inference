<text x="400" y="954" text-anchor="middle" font-size="16" font-weight="600" fill="#2d2d2d">GGUF file</text>
<text x="400" y="974" text-anchor="middle" font-size="12" fill="#5f5e5a">step-02</text>

<text x="400" y="1036" text-anchor="middle" font-size="18" font-style="italic" fill="#2d2d2d">The whole request path works <tspan font-weight="700" fill="#a45a00">before any maths exists.</tspan></text>
