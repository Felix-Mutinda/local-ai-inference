<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Step 04: measure</title>
<desc id="d">A side-by-side benchmark of local-ai-inference and llama.cpp on the same Q8_0 model file and the same HTTP benchmark: equal perplexity, llama.cpp faster to first token and about twice as fast at decoding, using less memory and reading fewer bytes per token.</desc>
<rect width="800" height="1000" fill="#ffffff"/>
<text x="400" y="62" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700"><tspan fill="#1a3a52">Step 04</tspan><tspan fill="#1a3a52" dx="12">·</tspan><tspan fill="#c57926" dx="12">Measure</tspan></text>
<g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<text x="400" y="102" text-anchor="middle" font-size="13" fill="#666666">SmolLM2-135M-Instruct Q8_0 · greedy · median of 3 · unique prompt per request</text>
<text x="400" y="122" text-anchor="middle" font-size="13" fill="#666666">2-vCPU Linux container · 2 threads each · llama.cpp via llama-cpp-python 0.3.37</text>
<rect x="60" y="150" width="680" height="50" rx="8" fill="#1a3a52"/>
<text x="84" y="181" font-size="14" font-weight="600" fill="#ffffff">Same Q8_0 file, same bench</text>
<text x="500" y="181" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">local-ai-inference</text>
<text x="652" y="181" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">llama.cpp</text>
<rect x="60" y="200" width="680" height="50" fill="#ffffff"/>
<text x="84" y="231" font-size="14" fill="#2d2d2d">Quality: perplexity, 276 tokens</text>
<text x="500" y="231" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#085041">50.31</text>
<text x="652" y="231" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#2d2d2d">50.60</text>
<rect x="60" y="250" width="680" height="50" fill="#f5f5f5"/>
<text x="84" y="281" font-size="14" fill="#2d2d2d">Pick the same next token</text>
<text x="576" y="281" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#2d2d2d">96.4% of positions</text>
<rect x="60" y="300" width="680" height="50" fill="#ffffff"/>
<text x="84" y="331" font-size="14" fill="#2d2d2d">First token, 46-token prompt</text>
<text x="500" y="331" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#085041">0.25 s</text>
<text x="652" y="331" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#2d2d2d">0.13 s</text>
<rect x="60" y="350" width="680" height="50" fill="#f5f5f5"/>
<text x="84" y="381" font-size="14" fill="#2d2d2d">First token, 423-token prompt</text>
<text x="500" y="381" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#085041">2.74 s</text>
<text x="652" y="381" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#2d2d2d">2.19 s</text>
<rect x="60" y="400" width="680" height="50" fill="#ffffff"/>
<text x="84" y="431" font-size="14" fill="#2d2d2d">Decode speed</text>
<text x="500" y="431" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#085041">15 tok/s</text>
<text x="652" y="431" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#2d2d2d">28–36 tok/s</text>
<rect x="60" y="450" width="680" height="50" fill="#f5f5f5"/>
<text x="84" y="481" font-size="14" fill="#2d2d2d">Server memory (RSS)</text>
<text x="500" y="481" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#085041">0.86 GB</text>
<text x="652" y="481" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#2d2d2d">0.56 GB</text>
<rect x="60" y="500" width="680" height="50" fill="#ffffff"/>
<text x="84" y="531" font-size="14" fill="#2d2d2d">Weight bytes read per token</text>
<text x="500" y="531" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#085041">538 MB</text>
<text x="652" y="531" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#2d2d2d">143 MB</text>
<rect x="60" y="150" width="680" height="400" rx="8" fill="none" stroke="#5f5e5a" stroke-width="1"/>
<line x1="424" y1="200" x2="424" y2="250" stroke="#d3d1c7"/><line x1="424" y1="300" x2="424" y2="550" stroke="#d3d1c7"/><line x1="576" y1="200" x2="576" y2="250" stroke="#d3d1c7"/><line x1="576" y1="300" x2="576" y2="550" stroke="#d3d1c7"/>
<rect x="60" y="578" width="680" height="170" rx="16" fill="none" stroke="#c57926" stroke-width="2"/>
<text x="84" y="610" font-size="16" font-weight="600" fill="#1a3a52">What it means</text>
<text x="84" y="638" font-size="14" fill="#2d2d2d">Same file, same quality: both engines run the same model correctly.</text>
<text x="84" y="662" font-size="14" fill="#2d2d2d">llama.cpp decodes about 2× faster and holds less memory. It keeps the</text>
<text x="84" y="684" font-size="14" fill="#2d2d2d">weights in Q8_0 and uses hand-written CPU kernels; this engine expands</text>
<text x="84" y="706" font-size="14" fill="#2d2d2d">them to float32 and reads ~3.7× more bytes for every token it generates.</text>
<text x="84" y="728" font-size="13" fill="#666666">Prompt processing is closer, because NumPy hands those big matrix multiplies to BLAS.</text>
<rect x="60" y="774" width="680" height="64" rx="8" fill="#f1efe8" stroke="#5f5e5a"/>
<text x="84" y="800" font-size="13" fill="#5f5e5a">Re-run on your machine, against any OpenAI-compatible server:</text>
<text x="84" y="824" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#2d2d2d">local-ai-inference bench --url &lt;server&gt;/v1 --model &lt;id&gt;</text>
<text x="400" y="905" text-anchor="middle" font-size="18" font-style="italic" fill="#2d2d2d">Same model, same quality. <tspan font-weight="700" fill="#a45a00">The difference is the cost per token.</tspan></text>
<text x="32" y="952" font-size="13" fill="#666666">numbers from one machine; yours will differ · code: tag step-04</text>
</g>
