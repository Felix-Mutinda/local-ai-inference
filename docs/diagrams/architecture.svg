<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Local AI Inference: architecture</title>
<desc id="d">A client calls the OpenAI-compatible API over HTTP. The API hands validated requests to the server, which manages lifecycle, admission, prompt preparation, output control, streaming and metrics. The server calls the engine through the Engine protocol; the engine tokenizes, runs the forward pass with a KV cache and samples. At startup the engine loads weights from the GGUF parser through the ModelFile protocol.</desc>
